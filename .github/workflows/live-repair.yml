name: Live Repair & Scene Caretaker (Omega Live Ops)
on:
  workflow_dispatch:
    inputs:
      mission:
        description: 'Scoped repair or scene-switch mission'
        required: true
        type: choice
        default: repair-display
        options:
          - repair-display
          - scene-switch
      issue_number:
        description: 'Optional issue number to reference (e.g. filed by live-health)'
        required: false
        type: string
        default: ''
      note:
        description: 'Optional instruction (e.g. target look/scene or specific display fix)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: trureturing-live-repair
  cancel-in-progress: false

jobs:
  live-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: read
    steps:
      - name: Check Omega Live Ops repair key configuration
        id: config
        env:
          NYXID_KEY: ${{ secrets.NYXID_LIVE_REPAIR_KEY }}
          NYXID_BASE_URL: ${{ vars.NYXID_LIVE_CODEX_BASE_URL }}
        run: |
          if [ -z "$NYXID_KEY" ] || [ -z "$NYXID_BASE_URL" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Skipping live-repair: configure repo secret NYXID_LIVE_REPAIR_KEY (from NyxID org Omega Live Ops) and repo variable NYXID_LIVE_CODEX_BASE_URL."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Prevent duplicate repair PRs (at most 1 open)
        id: guard
        if: steps.config.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          open_prs=$(gh pr list --repo "$REPO" --state open --head caretaker/live-repair --json number --jq 'length')
          if [ "${open_prs:-0}" -ge 1 ]; then
            echo "allow=false" >> "$GITHUB_OUTPUT"
            echo "An automated live-repair PR is already open; skipping."
          else
            echo "allow=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.config.outputs.ready == 'true' && steps.guard.outputs.allow == 'true'
        with:
          submodules: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.config.outputs.ready == 'true' && steps.guard.outputs.allow == 'true'
        with:
          node-version: '22'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.config.outputs.ready == 'true' && steps.guard.outputs.allow == 'true'
        with:
          python-version: '3.12'

      - name: Install Codex CLI
        if: steps.config.outputs.ready == 'true' && steps.guard.outputs.allow == 'true'
        run: npm install -g @openai/codex

      - name: Run scoped live-repair Codex mission
        if: steps.config.outputs.ready == 'true' && steps.guard.outputs.allow == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.NYXID_LIVE_REPAIR_KEY }}
          OPENAI_BASE_URL: ${{ vars.NYXID_LIVE_CODEX_BASE_URL }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MISSION: ${{ inputs.mission }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          OPERATOR_NOTE: ${{ inputs.note }}
        run: |
          set -euo pipefail
          issue_ctx=""
          if [[ "$ISSUE_NUMBER" =~ ^[0-9]+$ ]]; then
            issue_ctx=$(gh issue view "$ISSUE_NUMBER" --repo "$REPO" --json title,body --jq '"\(.title)\n\(.body)"' || true)
          fi
          cat <<'EOF' > /tmp/repair-prompt.txt
          You are the lightweight live-repair caretaker for the-omega-institute/trureturing-live (NyxID org: Omega Live Ops).
          HARD BOUNDARIES:
          - Only make small, surgical presentation/display/scene/sync fixes inside site/ or scripts/ or tests/.
          - NEVER alter workflow security gates, deployment rate limits, secrets, or research architecture.
          - NEVER expose GitHub usernames in UI code or comments.
          - Run `python3 -m unittest discover -s tests` and `node --test tests/*.test.mjs` and ensure all tests pass.
          - Do NOT run git push or gh pr create; leave clean working-tree changes only if a real fix is warranted.
          EOF
          printf "\nMission: %s\nOperator note: %s\nLinked issue #%s:\n%s\n" \
            "$MISSION" "$OPERATOR_NOTE" "$ISSUE_NUMBER" "$issue_ctx" >> /tmp/repair-prompt.txt
          codex exec --full-auto --sandbox workspace-write "$(cat /tmp/repair-prompt.txt)"

      - name: Verify tests & open PR with github-event-v2 footer
        if: steps.config.outputs.ready == 'true' && steps.guard.outputs.allow == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MISSION: ${{ inputs.mission }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes required by live-repair."
            exit 0
          fi

          python3 -m unittest discover -s tests -v
          node --test tests/*.test.mjs

          git config user.name "omega-live-repair[bot]"
          git config user.email "omega-live-repair[bot]@users.noreply.github.com"
          git checkout -B caretaker/live-repair
          git add -A
          git commit -m "chore(live-repair): automated ${MISSION} update"
          git push -u origin caretaker/live-repair --force-with-lease

          target="self"
          ref_line=""
          if [[ "$ISSUE_NUMBER" =~ ^[0-9]+$ ]]; then
            target="${REPO}#${ISSUE_NUMBER}"
            ref_line="Addresses #${ISSUE_NUMBER}."
          fi
          event_line=$(python3 scripts/format_agent_event.py \
            --agent codex/live-ops/repair \
            --action pr \
            --state progress \
            --target "$target")

          cat <<EOF > /tmp/pr-body.md
          Automated scoped \`${MISSION}\` patch prepared by **live-repair** (NyxID org: \`Omega Live Ops\`).
          ${ref_line}

          - Verified locally with \`python3 -m unittest discover -s tests\` and \`node --test tests/*.test.mjs\`.
          - Merging into \`main\` triggers the exclusive Pages deploy pipeline (\`<= 10 deploys/hour\`).

          ${event_line}
          EOF

          gh pr create --repo "$REPO" \
            --base main \
            --head caretaker/live-repair \
            --title "chore(live-repair): automated ${MISSION} update" \
            --body-file /tmp/pr-body.md
