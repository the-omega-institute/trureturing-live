name: Check dashboard
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: check-dashboard-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vendor/live-harness -> ../../.build/live-harness
      - name: Build pinned event foundation
        run: sh tools/build-foundation.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node --check site/assets/app.mjs
      - run: npm ci --ignore-scripts
      - run: npm test
