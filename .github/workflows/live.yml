name: Continuous public collaboration
on:
  schedule:
    - cron: '1-59/5 * * * *'
  workflow_dispatch:
concurrency:
  group: continuous-public-observer
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Observe and publish once per minute
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/live.py --minutes 55
