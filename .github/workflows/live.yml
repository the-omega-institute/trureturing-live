name: Continuous public collaboration
on:
  schedule:
    - cron: '1-59/5 * * * *'
  workflow_dispatch:
concurrency:
  group: continuous-public-observer
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vendor/live-harness -> ../../.build/live-harness
      - name: Build pinned event foundation
        run: sh tools/build-foundation.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Observe and publish once per minute
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/live.py --minutes 55
