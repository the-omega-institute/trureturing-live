name: Observe and publish
on:
  push:
    branches: [main]
  schedule:
    - cron: '2-59/15 * * * *'
  workflow_dispatch:
concurrency:
  group: live-publication
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - name: Collect public GitHub activity
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/collect.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish observatory
        id: deployment
        uses: actions/deploy-pages@v4
