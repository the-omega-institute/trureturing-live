name: Live Health Caretaker (Omega Live Ops)
on:
  schedule:
    # Low-frequency daily health check (read-only code, issues-only reporting)
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      note:
        description: 'Optional focus note for the health audit'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: trureturing-live-health
  cancel-in-progress: false

jobs:
  live-health:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check Omega Live Ops health key configuration
        id: config
        env:
          NYXID_KEY: ${{ secrets.NYXID_LIVE_HEALTH_KEY }}
          NYXID_BASE_URL: ${{ vars.NYXID_LIVE_CODEX_BASE_URL }}
        run: |
          if [ -z "$NYXID_KEY" ] || [ -z "$NYXID_BASE_URL" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Skipping live-health: configure repo secret NYXID_LIVE_HEALTH_KEY (from NyxID org Omega Live Ops) and repo variable NYXID_LIVE_CODEX_BASE_URL."
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.config.outputs.ready == 'true'
        with:
          persist-credentials: false
          submodules: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.config.outputs.ready == 'true'
        with:
          node-version: '22'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.config.outputs.ready == 'true'
        with:
          python-version: '3.12'

      - name: Collect read-only live telemetry & local test status
        id: probe
        if: steps.config.outputs.ready == 'true'
        run: |
          set +e
          npm ci --ignore-scripts > /tmp/probe-npm.log 2>&1
          npm_rc=$?
          python3 -m unittest discover -s tests -v > /tmp/probe-py.log 2>&1
          py_rc=$?
          npm test > /tmp/probe-js.log 2>&1
          js_rc=$?
          live_code=$(curl -sS -o /dev/null -w '%{http_code}' https://live.trureturing.org/ || echo "000")
          atlas_code=$(curl -sS -o /dev/null -w '%{http_code}' https://www.trureturing.org/data/atlas-startup.v1.json || echo "000")
          echo "npm_rc=$npm_rc py_rc=$py_rc js_rc=$js_rc live_code=$live_code atlas_code=$atlas_code"
          echo "py_rc=$py_rc" >> "$GITHUB_OUTPUT"
          echo "js_rc=$js_rc" >> "$GITHUB_OUTPUT"
          echo "live_code=$live_code" >> "$GITHUB_OUTPUT"
          echo "atlas_code=$atlas_code" >> "$GITHUB_OUTPUT"

      - name: Install Codex CLI
        if: steps.config.outputs.ready == 'true'
        run: npm install -g @openai/codex

      - name: Run read-only live-health Codex diagnosis
        if: steps.config.outputs.ready == 'true'
        env:
          NYXID_API_KEY: ${{ secrets.NYXID_LIVE_HEALTH_KEY }}
          NYXID_BASE_URL: ${{ vars.NYXID_LIVE_CODEX_BASE_URL }}
          CODEX_MODEL: ${{ vars.NYXID_LIVE_CODEX_MODEL }}
          AUDIT_NOTE: ${{ inputs.note }}
          PY_RC: ${{ steps.probe.outputs.py_rc }}
          JS_RC: ${{ steps.probe.outputs.js_rc }}
          LIVE_CODE: ${{ steps.probe.outputs.live_code }}
          ATLAS_CODE: ${{ steps.probe.outputs.atlas_code }}
        run: |
          set -euo pipefail
          model="${CODEX_MODEL:-gpt-5.4}"
          codex_home="$RUNNER_TEMP/codex-home"
          mkdir -p "$codex_home"
          cat <<EOF > "$codex_home/config.toml"
          approval_policy = "never"
          model_provider = "nyxid"
          model = "${model}"
          disable_response_storage = true

          [model_providers.nyxid]
          name = "nyxid"
          base_url = "${NYXID_BASE_URL}"
          wire_api = "responses"
          env_key = "NYXID_API_KEY"
          EOF

          cat <<'EOF' > /tmp/health-prompt.txt
          You are the read-only live-health caretaker for the-omega-institute/trureturing-live (NyxID org: Omega Live Ops).
          HARD BOUNDARIES:
          - DO NOT modify repository files or run git commit/push.
          - Inspect only the probe summary and (if any check failed) the probe logs / local files.
          - Your final response MUST follow this exact format:
            - If everything is healthy (py_rc=0, js_rc=0, live_code=200, atlas_code=200, and no broken data contract), output a single line:
              HEALTHY
            - If there IS a concrete anomaly, output `ALERT` on the first line, followed by a concise actionable markdown diagnostic report (under 25 lines, zero secrets/usernames).
          EOF
          printf "\nProbe summary: py_rc=%s js_rc=%s live_code=%s atlas_code=%s\nOperator note: %s\n" \
            "$PY_RC" "$JS_RC" "$LIVE_CODE" "$ATLAS_CODE" "$AUDIT_NOTE" >> /tmp/health-prompt.txt

          CODEX_HOME="$codex_home" codex exec \
            --ephemeral \
            --sandbox read-only \
            --output-last-message /tmp/health-out.txt \
            - < /tmp/health-prompt.txt

      - name: File deduplicated health issue with github-event-v2 footer
        if: steps.config.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          first_line=$(awk 'NF {print; exit}' /tmp/health-out.txt 2>/dev/null | tr -d '\r' || echo "HEALTHY")
          echo "Codex health verdict: $first_line"
          if [ "$first_line" != "ALERT" ]; then
            echo "Live observatory healthy; no issue filed."
            exit 0
          fi

          tail -n +2 /tmp/health-out.txt > /tmp/health-report.md
          if [ ! -s /tmp/health-report.md ]; then
            echo "ALERT verdict had empty body; skipping."
            exit 0
          fi

          open_issue=$(gh issue list --repo "$REPO" --state open --search "[live-health] in:title" --json number --jq '.[0].number // empty')
          target="self"
          if [ -n "$open_issue" ]; then
            target="${REPO}#${open_issue}"
          fi
          event_line=$(python3 scripts/format_agent_event.py \
            --agent codex/live-ops/health \
            --action issue \
            --state progress \
            --target "$target")

          {
            cat /tmp/health-report.md
            printf "\n\nWorkflow run: %s/actions/runs/%s\n\n%s\n" "https://github.com/$REPO" "$RUN_ID" "$event_line"
          } > /tmp/issue-body.md

          if [ -n "$open_issue" ]; then
            gh issue comment "$open_issue" --repo "$REPO" --body-file /tmp/issue-body.md
          else
            gh issue create --repo "$REPO" \
              --title "[live-health] Automated observatory health alert" \
              --body-file /tmp/issue-body.md
          fi
