name: Live Template Sync Caretaker (Omega Live Ops)
on:
  workflow_dispatch:
    inputs:
      note:
        description: 'Optional scope note for syncing generic UI improvements into trureturing-live-template'
        required: false
        type: string
        default: ''

permissions: {}

concurrency:
  group: trureturing-live-template-sync
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      config_state: ${{ steps.config.outputs.state }}
      has_changes: ${{ steps.export.outputs.has_changes }}
      source_sha: ${{ steps.export.outputs.source_sha }}
      template_base_sha: ${{ steps.export.outputs.template_base_sha }}
    steps:
      - name: Check Omega Live Ops template-sync configuration
        id: config
        env:
          NYXID_KEY: ${{ secrets.NYXID_LIVE_TEMPLATE_SYNC_KEY }}
          NYXID_BASE_URL: ${{ vars.NYXID_LIVE_CODEX_BASE_URL }}
          TEMPLATE_TOKEN: ${{ secrets.LIVE_TEMPLATE_PR_TOKEN }}
        run: |
          missing=""
          [ -z "$NYXID_KEY" ] && missing="${missing} NYXID_LIVE_TEMPLATE_SYNC_KEY"
          [ -z "$NYXID_BASE_URL" ] && missing="${missing} NYXID_LIVE_CODEX_BASE_URL"
          [ -z "$TEMPLATE_TOKEN" ] && missing="${missing} LIVE_TEMPLATE_PR_TOKEN"
          if [ -n "$missing" ]; then
            echo "state=not_configured" >> "$GITHUB_OUTPUT"
            {
              echo "### Live Template Sync: Not Configured"
              echo "- Missing required configuration:${missing}"
              echo "- Status is explicitly \`not_configured\` (no synchronization was executed or verified)."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "state=configured" >> "$GITHUB_OUTPUT"

      - name: Checkout trureturing-live (read-only source, zero write creds)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.config.outputs.state == 'configured'
        with:
          path: source-live
          persist-credentials: false

      - name: Checkout trureturing-live-template (read-only public clone, zero write creds)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.config.outputs.state == 'configured'
        with:
          repository: the-omega-institute/trureturing-live-template
          path: target-template
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.config.outputs.state == 'configured'
        with:
          node-version: '22'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.config.outputs.state == 'configured'
        with:
          python-version: '3.12'

      - name: Install Codex CLI
        if: steps.config.outputs.state == 'configured'
        run: npm install -g @openai/codex

      - name: Run scoped template-sync Codex mission (zero GitHub write token)
        if: steps.config.outputs.state == 'configured'
        env:
          NYXID_API_KEY: ${{ secrets.NYXID_LIVE_TEMPLATE_SYNC_KEY }}
          NYXID_BASE_URL: ${{ vars.NYXID_LIVE_CODEX_BASE_URL }}
          CODEX_MODEL: ${{ vars.NYXID_LIVE_CODEX_MODEL }}
          SYNC_NOTE: ${{ inputs.note }}
        run: |
          set -euo pipefail
          model="${CODEX_MODEL:-gpt-6.1-sol}"
          codex_home="$RUNNER_TEMP/codex-home"
          mkdir -p "$codex_home"
          cat <<EOF > "$codex_home/config.toml"
          approval_policy = "never"
          model_provider = "nyxid"
          model = "${model}"

          [model_providers.nyxid]
          name = "nyxid"
          base_url = "${NYXID_BASE_URL}"
          wire_api = "responses"
          env_key = "NYXID_API_KEY"
          EOF

          cat <<'EOF' > /tmp/sync-prompt.txt
          You are the scoped live-template-sync caretaker (NyxID org: Omega Live Ops).
          - source-live/ is the read-only reference observatory (trureturing-live).
          - target-template/ is the open-source starter template (trureturing-live-template).
          HARD BOUNDARIES:
          - ONLY edit generic starter UI files under target-template/ui/ (index.html, assets/app.css, assets/app.mjs).
          - NEVER modify source-live/, Rust core contracts, Cargo.toml, workflows, or examples/organization.json.
          - Strip all TruReturing-specific branding/Chinese copy; keep target-template/ui/ 100% English and organization-agnostic with zero GitHub usernames shown.
          - If target-template/ui/ is already up to date with source-live/, make NO edits.
          - Do NOT run git push or gh pr create; a separate trusted job validates and publishes your patch.
          EOF
          printf "\nOperator note: %s\n" "$SYNC_NOTE" >> /tmp/sync-prompt.txt

          CODEX_HOME="$codex_home" codex exec \
            --ephemeral \
            --sandbox workspace-write \
            - < /tmp/sync-prompt.txt

      - name: Verify source-live untouched and export ui-only template patch
        id: export
        if: steps.config.outputs.state == 'configured'
        run: |
          set -euo pipefail
          if [ -n "$(git -C source-live status --porcelain)" ]; then
            echo "Refusing run: read-only source-live/ was modified."
            exit 2
          fi
          source_sha=$(git -C source-live rev-parse HEAD)
          template_base_sha=$(git -C target-template rev-parse HEAD)
          out=$(python3 source-live/scripts/caretaker_guard.py export-patch \
            --repo-dir target-template \
            --allowed-prefix ui/ \
            --out-patch /tmp/template.patch \
            --out-manifest /tmp/template-manifest.json)
          echo "$out"
          has_changes=$(echo "$out" | awk -F= '$1=="has_changes"{print $2}')
          echo "has_changes=$has_changes" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "template_base_sha=$template_base_sha" >> "$GITHUB_OUTPUT"

      - name: Upload ui-only template patch artifact
        if: steps.config.outputs.state == 'configured' && steps.export.outputs.has_changes == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: live-template-sync-patch
          path: |
            /tmp/template.patch
            /tmp/template-manifest.json
          retention-days: 3
          if-no-files-found: error

  publish:
    needs: propose
    if: needs.propose.outputs.config_state == 'configured' && needs.propose.outputs.has_changes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Prevent duplicate template-sync PRs (at most 1 open)
        id: guard
        env:
          GH_TOKEN: ${{ secrets.LIVE_TEMPLATE_PR_TOKEN }}
        run: |
          open_prs=$(gh pr list --repo the-omega-institute/trureturing-live-template --state open --head caretaker/template-sync --json number --jq 'length')
          if [ "${open_prs:-0}" -ge 1 ]; then
            echo "allow=false" >> "$GITHUB_OUTPUT"
            echo "An automated template-sync PR is already open; skipping."
          else
            echo "allow=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout trureturing-live trusted guard scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.guard.outputs.allow == 'true'
        with:
          ref: ${{ needs.propose.outputs.source_sha }}
          path: source-live
          persist-credentials: false

      - name: Checkout trureturing-live-template at exact base SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.guard.outputs.allow == 'true'
        with:
          repository: the-omega-institute/trureturing-live-template
          ref: ${{ needs.propose.outputs.template_base_sha }}
          token: ${{ secrets.LIVE_TEMPLATE_PR_TOKEN }}
          path: target-template

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.guard.outputs.allow == 'true'
        with:
          node-version: '22'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.guard.outputs.allow == 'true'
        with:
          python-version: '3.12'

      - name: Download ui-only template patch artifact
        if: steps.guard.outputs.allow == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: live-template-sync-patch
          path: /tmp/template-bundle

      - name: Independently verify ui-only patch, apply, and run template checks
        if: steps.guard.outputs.allow == 'true'
        run: |
          set -euo pipefail
          python3 source-live/scripts/caretaker_guard.py verify-patch \
            --repo-dir target-template \
            --allowed-prefix ui/ \
            --patch /tmp/template-bundle/template.patch \
            --manifest /tmp/template-bundle/template-manifest.json
          cd target-template
          ./check.sh
          node --check ui/assets/app.mjs

      - name: Push validated template branch and open PR
        if: steps.guard.outputs.allow == 'true'
        env:
          GH_TOKEN: ${{ secrets.LIVE_TEMPLATE_PR_TOKEN }}
          SOURCE_SHA: ${{ needs.propose.outputs.source_sha }}
          TEMPLATE_BASE_SHA: ${{ needs.propose.outputs.template_base_sha }}
        run: |
          set -euo pipefail
          cd target-template
          git config user.name "omega-live-template-sync[bot]"
          git config user.email "omega-live-template-sync[bot]@users.noreply.github.com"
          git checkout -B caretaker/template-sync
          git commit -m "chore(ui): sync generic observatory updates from trureturing-live"
          candidate_sha=$(git rev-parse HEAD)
          git push -u origin caretaker/template-sync --force-with-lease

          event_line=$(python3 ../source-live/scripts/format_agent_event.py \
            --agent codex/live-ops/template-sync \
            --action pr \
            --state progress \
            --target "the-omega-institute/trureturing-live@${SOURCE_SHA}")

          cat <<EOF > /tmp/template-pr-body.md
          Automated starter UI sync from \`the-omega-institute/trureturing-live@${SOURCE_SHA}\` by **live-template-sync** (NyxID org: \`Omega Live Ops\`) via isolated trusted publication job.

          - Template base SHA: \`${TEMPLATE_BASE_SHA}\` · Candidate SHA: \`${candidate_sha}\`
          - Strictly verified \`ui/\`-only scope before and after \`git apply\`.
          - Verified with \`./check.sh\` and \`node --check ui/assets/app.mjs\`.

          ${event_line}
          EOF

          pr_url=$(gh pr create --repo the-omega-institute/trureturing-live-template \
            --base main \
            --head caretaker/template-sync \
            --title "chore(ui): sync generic observatory updates from trureturing-live" \
            --body-file /tmp/template-pr-body.md)
          {
            echo "### Live Template Sync PR Published"
            echo "- PR: ${pr_url}"
            echo "- Source SHA: \`${SOURCE_SHA}\`"
            echo "- Template Base SHA: \`${TEMPLATE_BASE_SHA}\` → Candidate SHA: \`${candidate_sha}\`"
          } >> "$GITHUB_STEP_SUMMARY"
